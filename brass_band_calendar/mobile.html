<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>吹奏楽練習カレンダー (スマホ専用版)</title>
  <meta name="description" content="吹奏楽団・ブラスバンドのためのスマホ専用練習カレンダー＆時間割アプリ">
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="mobile-style.css?v=20260817_v13">
</head>
<body class="mobile-body">
  <!-- Mobile Ambient Glow background -->
  <div class="m-glow m-glow-1"></div>
  <div class="m-glow m-glow-2"></div>

  <div id="mobileApp">
    <!-- Top Mobile Sticky Navigation Header -->
    <header class="m-header">
      <div class="m-brand-bar">
        <div class="m-brand-left">
          <span class="m-logo">🎼</span>
          <span class="m-title">吹奏楽カレンダー</span>
        </div>
        <div class="m-brand-right">
          <div id="mAdminModeBadge" class="m-pc-link" style="cursor: pointer; background: rgba(255,255,255,0.08); border-color: var(--glass-border);">
            👁️ <span style="font-size: 0.72rem; color: #cbd5e1;">閲覧専用</span>
          </div>
          <button id="mBtnBackup" class="m-icon-btn admin-only" title="データ管理">💾</button>
          <a href="index.html?desktop=1" class="m-pc-link">💻 PC版</a>
        </div>
      </div>

      <!-- Quick Date Switcher Bar -->
      <div class="m-date-bar">
        <button id="mBtnPrev" class="m-arrow-btn">◀</button>
        <button id="mBtnToday" class="m-today-btn">今日</button>
        <button id="mBtnNext" class="m-arrow-btn">▶</button>
        <div id="mCurrentPeriodText" class="m-period-text">2026年 8月</div>
        <button id="mBtnBulkExport" class="m-bulk-btn">📅 一括連携</button>
      </div>

      <!-- Category Filter Chips -->
      <div class="m-filter-scroll">
        <button class="m-chip active" data-cat="all">すべて</button>
        <button class="m-chip" data-cat="合奏">合奏</button>
        <button class="m-chip" data-cat="パート練習">パート</button>
        <button class="m-chip" data-cat="個人練習">個人</button>
        <button class="m-chip" data-cat="本番">本番</button>
      </div>
    </header>

    <!-- Main Dynamic Content Views (Vertical Portrait Scrollable Area) -->
    <main class="m-content">
      <!-- 1. Month View -->
      <section id="mMonthView" class="m-view-panel">
        <div class="m-month-grid">
          <div class="m-weekday sun">日</div>
          <div class="m-weekday">月</div>
          <div class="m-weekday">火</div>
          <div class="m-weekday">水</div>
          <div class="m-weekday">木</div>
          <div class="m-weekday">金</div>
          <div class="m-weekday sat">土</div>
          <!-- Days populated dynamically by mobile-app.js -->
        </div>

        <!-- Selected Day Rehearsal Sheet Card (Appears on Day Tap) -->
        <div id="mDaySheetContainer"></div>
      </section>

      <!-- 2. Day View -->
      <section id="mDayView" class="m-view-panel" style="display: none;">
        <div id="mDayViewContent"></div>
      </section>

      <!-- 3. Timetable View -->
      <section id="mTimetableView" class="m-view-panel" style="display: none;">
        <div id="mTimetableContent"></div>
      </section>

      <!-- 4. Repertoire Library View -->
      <section id="mRepertoireView" class="m-view-panel" style="display: none;">
        <div class="m-rep-header-card" style="margin-bottom: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.1rem; color: var(--color-brass-light); font-weight: 800;">🎼 演奏曲目ライブラリ</h2>
            <button id="mBtnAddNewSong" class="m-action-btn-gold admin-only">+ 曲を追加</button>
          </div>
        </div>
        <div id="mRepertoireContent"></div>
      </section>
    </main>

    <!-- Native Fixed Bottom Navigation Dock Bar -->
    <nav class="m-bottom-nav">
      <button class="m-nav-item active" data-view="month">
        <span class="m-nav-icon">📅</span>
        <span class="m-nav-label">月表示</span>
      </button>

      <button class="m-nav-item" data-view="day">
        <span class="m-nav-icon">📋</span>
        <span class="m-nav-label">日表示</span>
      </button>

      <button class="m-nav-item m-nav-add admin-only" id="mBtnAddPractice" title="練習予定を登録">
        <div class="m-add-circle">＋</div>
      </button>

      <button class="m-nav-item" data-view="timetable">
        <span class="m-nav-icon">⏱️</span>
        <span class="m-nav-label">時間割</span>
      </button>

      <button class="m-nav-item" data-view="repertoire">
        <span class="m-nav-icon">🎼</span>
        <span class="m-nav-label">曲目</span>
      </button>
    </nav>

    <!-- Native Slide-up Bottom Sheet Modals System -->

    <!-- Sheet 1: Practice Registration / Edit Modal -->
    <div id="mPracticeModal" class="m-sheet-backdrop">
      <div class="m-sheet-content">
        <div class="m-sheet-handle"></div>
        <div class="m-sheet-header">
          <h3 id="mModalTitle">📅 練習の登録</h3>
          <button class="m-close-btn" data-close="mPracticeModal">&times;</button>
        </div>

        <form id="mPracticeForm">
          <input type="hidden" id="mPracticeId">

          <div class="m-form-group">
            <label>📅 練習日 *</label>
            <input type="date" id="mInputDate" class="m-input" required>
          </div>

          <div class="m-form-group">
            <label>🏷️ 全体区分 *</label>
            <select id="mInputCategory" class="m-input" required>
              <option value="合奏">合奏</option>
              <option value="パート練習">パート練習</option>
              <option value="個人練習">個人練習</option>
              <option value="本番">本番</option>
              <option value="その他">その他</option>
            </select>
          </div>

          <div class="m-form-group">
            <label>✏️ 練習タイトル *</label>
            <input type="text" id="mInputTitle" class="m-input" placeholder="例: 通常練習 (18:00〜21:00)" required>
          </div>

          <div class="m-form-group">
            <label>📍 場所</label>
            <input type="text" id="mInputLocationName" class="m-input" placeholder="例: 日章福祉交流センター">
          </div>

          <div class="m-form-group">
            <label>👨‍🏫 当日指揮者 (公文 / 下川)</label>
            <input type="text" id="mInputConductors" class="m-input" placeholder="例: 公文 / 下川">
          </div>

          <!-- Practice Timetable list (時間軸明示対応) -->
          <div class="m-form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <label>⏱️ タイムスケジュール枠の追加・編集</label>
              <button type="button" id="mBtnAddTimetableRow" class="m-btn-sm">+ 時間枠追加</button>
            </div>
            <div id="mTimetableContainer"></div>
          </div>

          <!-- Practice Pieces list -->
          <div class="m-form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <label>🎼 練習予定曲目ライブラリ情報</label>
              <button type="button" id="mBtnAddPieceRow" class="m-btn-sm">+ 曲追加</button>
            </div>
            <div id="mPiecesContainer"></div>
          </div>

          <div class="m-form-group">
            <label>💬 全体連絡事項・備考</label>
            <textarea id="mInputNotes" class="m-input" placeholder="連絡事項..."></textarea>
          </div>

          <div style="display:flex; gap:8px; margin-top:14px;">
            <button type="button" class="m-btn-glass" data-close="mPracticeModal" style="flex:1;">キャンセル</button>
            <button type="submit" class="m-btn-gold" style="flex:2;">保存する</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Sheet 2: Edit Song / YouTube Modal -->
    <div id="mEditSongModal" class="m-sheet-backdrop">
      <div class="m-sheet-content">
        <div class="m-sheet-handle"></div>
        <div class="m-sheet-header">
          <h3 id="mEditSongTitleText">✏️ 曲目 & YouTubeの編集</h3>
          <button class="m-close-btn" data-close="mEditSongModal">&times;</button>
        </div>

        <form id="mEditSongForm">
          <input type="hidden" id="mEditSongId">

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
            <div class="m-form-group">
              <label>区分 *</label>
              <select id="mEditSongSection" class="m-input">
                <option value="第1部">第1部</option>
                <option value="第2部">第2部</option>
                <option value="Enc">Enc</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div class="m-form-group">
              <label>No. *</label>
              <input type="text" id="mEditSongNo" class="m-input" placeholder="例: OP, 1" required>
            </div>
          </div>

          <div class="m-form-group">
            <label>曲名 *</label>
            <input type="text" id="mEditSongTitle" class="m-input" placeholder="曲名" required>
          </div>

          <div class="m-form-group">
            <label>作曲 / 編曲</label>
            <input type="text" id="mEditSongComposer" class="m-input" placeholder="作曲者">
          </div>

          <div class="m-form-group">
            <label>👨‍🏫 指揮 (公文 / 下川)</label>
            <input type="text" id="mEditSongConductor" class="m-input" placeholder="公文 / 下川">
          </div>

          <div class="m-form-group">
            <label>練習のポイント</label>
            <textarea id="mEditSongPoints" class="m-input" placeholder="ポイント..."></textarea>
          </div>

          <div class="m-form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <label>🎬 YouTube動画URL</label>
              <button type="button" id="mBtnAddSongVideoRow" class="m-btn-sm">+ 動画追加</button>
            </div>
            <div id="mSongVideosContainer"></div>
          </div>

          <div style="display:flex; gap:8px; margin-top:14px;">
            <button type="button" id="mBtnDeleteSong" class="m-btn-danger" style="display:none;">削除</button>
            <button type="button" class="m-btn-glass" data-close="mEditSongModal" style="flex:1;">キャンセル</button>
            <button type="submit" class="m-btn-gold" style="flex:2;">保存する</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Sheet 3: Practice Detail View -->
    <div id="mDetailModal" class="m-sheet-backdrop">
      <div class="m-sheet-content">
        <div class="m-sheet-handle"></div>
        <div class="m-sheet-header">
          <h3>ℹ️ 練習詳細 & タイムスケジュール</h3>
          <button class="m-close-btn" data-close="mDetailModal">&times;</button>
        </div>
        <div id="mDetailModalBody"></div>
      </div>
    </div>

    <!-- Sheet 4: Bulk Export Modal -->
    <div id="mBulkModal" class="m-sheet-backdrop">
      <div class="m-sheet-content">
        <div class="m-sheet-handle"></div>
        <div class="m-sheet-header">
          <h3>📅 期間指定 一括連携 & LINE共有</h3>
          <button class="m-close-btn" data-close="mBulkModal">&times;</button>
        </div>

        <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px;">
          <button class="m-btn-sm" id="mPresetThisMonth">今月</button>
          <button class="m-btn-sm" id="mPresetNextMonth">来月</button>
          <button class="m-btn-sm" id="mPresetAugSep" style="color:var(--color-brass-light);">8〜9月</button>
          <button class="m-btn-sm" id="mPresetAll">全期間</button>
        </div>

        <div class="m-form-group">
          <label>開始日</label>
          <input type="date" id="mBulkStartDate" class="m-input">
        </div>
        <div class="m-form-group">
          <label>終了日</label>
          <input type="date" id="mBulkEndDate" class="m-input">
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; margin-top:14px;">
          <button id="mBtnBulkLineShare" class="m-btn-line">📲 LINEで一括共有</button>
          <button id="mBtnBulkLineCopy" class="m-btn-glass">📋 テキストをコピー</button>
          <button id="mBtnBulkDownloadIcs" class="m-btn-gold">🍎 iPhoneカレンダーに一括追加 (.ics)</button>
        </div>
      </div>
    </div>

    <!-- Sheet 5: Data Backup Sheet -->
    <div id="mBackupModal" class="m-sheet-backdrop">
      <div class="m-sheet-content">
        <div class="m-sheet-handle"></div>
        <div class="m-sheet-header">
          <h3>💾 データ管理・バックアップ</h3>
          <button class="m-close-btn" data-close="mBackupModal">&times;</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
          <button id="mBtnExportJson" class="m-btn-gold">📤 データ書き出し (JSON)</button>
          <input type="file" id="mImportJsonFile" accept=".json" style="display:none;">
          <button id="mBtnImportJson" class="m-btn-glass">📥 データを読み込む (JSON)</button>
          <button id="mBtnResetData" class="m-btn-danger">🔄 初期データ（公文/下川）にリセット</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Mobile JavaScript Logic with Cache-Buster v13 -->
  <script type="module" src="mobile-app.js?v=20260817_v13"></script>
</body>
</html>
